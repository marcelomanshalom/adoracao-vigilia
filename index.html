<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoração Ininterrupta - Missão Guarulhos</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --card-bg: #ffffff;
            --text-main: #0f172a;
            --text-secondary: #475569;
            --border: #cbd5e1;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --vigilia-bg: #fef2f2;
            --vigilia-text: #991b1b;
            --locked-bg: #e2e8f0;
            --locked-text: #94a3b8;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            margin: 0;
            padding: 30px 15px;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 1350px;
            margin: 0 auto;
            background-color: var(--card-bg);
            border-radius: 20px;
            box-shadow: var(--shadow);
            padding: 30px;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.8);
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 {
            font-size: 26px;
            color: var(--text-main);
            margin: 0;
            font-weight: 800;
        }

        /* Navegação por Meses */
        .months-nav {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 25px;
            justify-content: center;
            scrollbar-width: thin;
        }

        .month-btn {
            background-color: #f1f5f9;
            border: none;
            border-radius: 12px;
            padding: 10px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s ease;
        }

        .month-btn:hover:not(:disabled) {
            background-color: #e2e8f0;
            color: var(--text-main);
        }

        .month-btn.active {
            background-color: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
        }

        .month-btn:disabled {
            background-color: var(--locked-bg);
            color: var(--locked-text);
            cursor: not-allowed;
            opacity: 0.7;
        }

        .month-section {
            display: none;
            animation: fadeIn 0.3s ease-in-out;
        }

        .month-section.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
            margin-top: 10px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 13px;
            background-color: white;
        }

        th, td {
            padding: 10px 12px;
            border-bottom: 1px solid var(--border);
            border-right: 1px solid var(--border);
        }

        th:last-child, td:last-child {
            border-right: none;
        }

        th {
            background-color: #f8fafc;
            color: var(--text-main);
            font-weight: 700;
            text-align: center;
            white-space: nowrap;
        }

        .time-col {
            font-weight: 600;
            color: var(--primary);
            background-color: #f8fafc;
            text-align: center;
            white-space: nowrap;
            width: 140px;
        }

        tr.vigilia-row td {
            background-color: var(--vigilia-bg);
        }
        tr.vigilia-row .time-col {
            background-color: #fee2e2;
            color: var(--vigilia-text);
        }

        .slot-cell {
            cursor: pointer;
            transition: background-color 0.15s;
            text-align: center;
            vertical-align: middle;
            min-width: 110px;
        }

        .slot-cell:hover {
            background-color: #f1f5f9;
        }

        .participant-tags {
            display: flex;
            flex-direction: column;
            gap: 4px;
            align-items: center;
        }

        .tag {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            width: 100%;
            box-sizing: border-box;
            word-break: break-word;
        }

        .tag span {
            flex-grow: 1;
            text-align: left;
        }

        .tag button {
            background: none;
            border: none;
            color: #ef4444;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            padding: 0 2px;
        }

        .tag button:hover {
            color: #b91c1c;
        }

        .instructions {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Missão Guarulhos</h1>
        </header>

        <div class="instructions">
            💡 Dica: Clique em qualquer horário na tabela para se inscrever. Caso tenha imprevistos, você pode remover ou editar sua inscrição clicando no "X" ao lado do seu nome.
        </div>
        
        <!-- Navegação de Meses 2026 / 2027 -->
        <div class="months-nav" id="monthsNav">
            <script>
                const meses = [
                    { id: 'jan-2026', nome: 'Janeiro de 2026', ano: 2026, mesIndex: 0 }, 
                    { id: 'fev-2026', nome: 'Fevereiro de 2026', ano: 2026, mesIndex: 1 },
                    { id: 'mar-2026', nome: 'Março de 2026', ano: 2026, mesIndex: 2 }, 
                    { id: 'abr-2026', nome: 'Abril de 2026', ano: 2026, mesIndex: 3 },
                    { id: 'mai-2026', nome: 'Maio de 2026', ano: 2026, mesIndex: 4 }, 
                    { id: 'jun-2026', nome: 'Junho de 2026', ano: 2026, mesIndex: 5 },
                    { id: 'jul-2026', nome: 'Julho de 2026', ano: 2026, mesIndex: 6 }, 
                    { id: 'ago-2026', nome: 'Agosto de 2026', ano: 2026, mesIndex: 7 },
                    { id: 'set-2026', nome: 'Setembro de 2026', ano: 2026, mesIndex: 8 }, 
                    { id: 'out-2026', nome: 'Outubro de 2026', ano: 2026, mesIndex: 9 },
                    { id: 'nov-2026', nome: 'Novembro de 2026', ano: 2026, mesIndex: 10 }, 
                    { id: 'dez-2026', nome: 'Dezembro de 2026', ano: 2026, mesIndex: 11 },
                    { id: 'jan-2027', nome: 'Janeiro de 2027', ano: 2027, mesIndex: 0 }, 
                    { id: 'fev-2027', nome: 'Fevereiro de 2027', ano: 2027, mesIndex: 1 },
                    { id: 'mar-2027', nome: 'Março de 2027', ano: 2027, mesIndex: 2 }, 
                    { id: 'abr-2027', nome: 'Abril de 2027', ano: 2027, mesIndex: 3 },
                    { id: 'mai-2027', nome: 'Maio de 2027', ano: 2027, mesIndex: 4 }, 
                    { id: 'jun-2027', nome: 'Junho de 2027', ano: 2027, mesIndex: 5 },
                    { id: 'jul-2027', nome: 'Julho de 2027', ano: 2027, mesIndex: 6 }, 
                    { id: 'ago-2027', nome: 'Agosto de 2027', ano: 2027, mesIndex: 7 },
                    { id: 'set-2027', nome: 'Setembro de 2027', ano: 2027, mesIndex: 8 }, 
                    { id: 'out-2027', nome: 'Outubro de 2027', ano: 2027, mesIndex: 9 },
                    { id: 'nov-2027', nome: 'Novembro de 2027', ano: 2027, mesIndex: 10 }, 
                    { id: 'dez-2027', nome: 'Dezembro de 2027', ano: 2027, mesIndex: 11 }
                ];

                document.write(meses.map((m, index) => `
                    <button class="month-btn ${index === 0 ? 'active' : ''}" id="btn-${m.id}" onclick="showMonth('${m.id}', this)">${m.nome.split(' ')[0]} ${m.ano}</button>
                `).join(''));
            </script>
        </div>

        <div id="contentContainer">
            <script>
                const diasSemana = [
                    "Segunda (Início 19h)", "Terça", "Quarta", "Quinta", "Sexta", "Sábado", "Domingo", "Segunda (Término 19h)"
                ];

                const horarios = [
                    { t: "02:00 as 03:00", vigilia: true }, { t: "03:00 as 04:00", vigilia: true },
                    { t: "04:00 as 05:00", vigilia: true }, { t: "05:00 as 06:00", vigilia: true },
                    { t: "06:00 as 07:00", vigilia: false }, { t: "07:00 as 08:00", vigilia: false },
                    { t: "08:00 as 09:00", vigilia: false }, { t: "09:00 as 10:00", vigilia: false },
                    { t: "10:00 as 11:00", vigilia: false }, { t: "11:00 as 12:00", vigilia: false },
                    { t: "12:00 as 13:00", vigilia: false }, { t: "13:00 as 14:00", vigilia: false },
                    { t: "14:00 as 15:00", vigilia: false }, { t: "15:00 as 16:00", vigilia: false },
                    { t: "16:00 as 17:00", vigilia: false }, { t: "17:00 as 18:00", vigilia: false },
                    { t: "18:00 as 19:00", vigilia: false }, { t: "19:00 as 20:00", vigilia: false },
                    { t: "20:00 as 21:00", vigilia: false }, { t: "21:00 as 22:00", vigilia: false },
                    { t: "22:00 as 23:00", vigilia: true }, { t: "23:00 as 00:00", vigilia: true },
                    { t: "00:00 as 01:00", vigilia: true }, { t: "01:00 as 02:00", vigilia: true }
                ];

                document.write(meses.map((m, index) => `
                    <div id="${m.id}" class="month-section ${index === 0 ? 'active' : ''}">
                        <h2 style="font-size:18px; color:var(--primary); margin-bottom:15px;">${m.nome}</h2>
                        <div class="table-responsive">
                            <table>
                                <thead>
                                    <tr>
                                        <th>HORÁRIO</th>
                                        ${diasSemana.map((d) => `<th>${d}</th>`).join('')}
                                    </tr>
                                </thead>
                                <tbody>
                                    ${horarios.map(h => `
                                        <tr class="${h.vigilia ? 'vigilia-row' : ''}">
                                            <td class="time-col">${h.t}</td>${diasSemana.map(() => `<td class="slot-cell" onclick="handleCellClick(event, this)"><div class="participant-tags"></div></td>`).join('')}
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                        </div>
                    </div>
                `).join(''));
            </script>
        </div>
    </div>

    <script>
        function atualizarBloqueioMeses() {
            const agora = new Date();
            const anoAtual = agora.getFullYear();
            const mesAtual = agora.getMonth();

            meses.forEach((m) => {
                let btn = document.getElementById(`btn-${m.id}`);
                if (!btn) return;

                let liberado = (m.ano < anoAtual) || (m.ano === anoAtual && m.mesIndex <= mesAtual);

                let dadosSalvos = localStorage.getItem('adoracao_escala_v4');
                if (dadosSalvos) {
                    let parsed = JSON.parse(dadosSalvos);
                    if (parsed[m.id] && temPreenchimento(parsed[m.id])) {
                        liberado = true;
                    }
                }

                if (liberado) {
                    btn.disabled = false;
                    btn.innerText = m.nome.split(' ')[0] + ' ' + m.ano;
                } else {
                    btn.disabled = true;
                    btn.innerText = '🔒 ' + m.nome.split(' ')[0] + ' ' + m.ano;
                }
            });
        }

        function temPreenchimento(mesData) {
            if (!mesData || !mesData.rowsData) return false;
            return mesData.rowsData.some(row => row.some(tags => tags.length > 0));
        }

        function showMonth(monthId, btnElement) {
            if (btnElement.disabled) return;

            document.querySelectorAll('.month-section').forEach(section => {
                section.classList.remove('active');
            });
            document.querySelectorAll('.month-btn').forEach(btn => {
                btn.classList.remove('active');
            });

            document.getElementById(monthId).classList.add('active');
            btnElement.classList.add('active');
        }

        function handleCellClick(event, cell) {
            // Se clicou diretamente no botão de excluir (X), não abre o prompt de inclusão
            if (event.target.tagName === 'BUTTON') return;

            let container = cell.querySelector('.participant-tags');
            let nome = prompt("Deseja adicionar seu nome ou célula a este horário:");
            
            if (nome && nome.trim() !== "") {
                adicionarTag(container, nome.trim());
                saveData();
            }
        }

        function adicionarTag(container, texto) {
            let tag = document.createElement('div');
            tag.className = 'tag';

            let span = document.createElement('span');
            span.innerText = texto;

            let btnRemover = document.createElement('button');
            btnRemover.innerText = '×';
            btnRemover.title = 'Remover / Cancelar';
            btnRemover.onclick = function(e) {
                e.stopPropagation(); // Evita reabrir o prompt
                tag.remove();
                saveData();
            };

            tag.appendChild(span);
            tag.appendChild(btnRemover);
            container.appendChild(tag);
        }

        function saveData() {
            let data = {};
            document.querySelectorAll('.month-section').forEach(sec => {
                let id = sec.id;
                let rowsData = [];
                sec.querySelectorAll('tbody tr').forEach(row => {
                    let rData = [];
                    row.querySelectorAll('.participant-tags').forEach(container => {
                        let tags = [];
                        container.querySelectorAll('.tag span').forEach(span => tags.push(span.innerText));
                        rData.push(tags);
                    });
                    rowsData.push(rData);
                });
                data[id] = { rowsData };
            });
            localStorage.setItem('adoracao_escala_v4', JSON.stringify(data));
        }

        window.onload = function() {
            let saved = localStorage.getItem('adoracao_escala_v4');
            if (saved) {
                let data = JSON.parse(saved);
                for (let monthId in data) {
                    let sec = document.getElementById(monthId);
                    if (sec) {
                        let rows = sec.querySelectorAll('tbody tr');
                        data[monthId].rowsData.forEach((rData, rIdx) => {
                            if (rows[rIdx]) {
                                let containers = rows[rIdx].querySelectorAll('.participant-tags');
                                rData.forEach((tagsArray, cIdx) => {
                                    if (containers[cIdx]) {
                                        containers[cIdx].innerHTML = '';
                                        tagsArray.forEach(tagName => {
                                            adicionarTag(containers[cIdx], tagName);
                                        });
                                    }
                                });
                            }
                        });
                    }
                }
            }
            atualizarBloqueioMeses();
        };
    </script>
</body>
</html>
